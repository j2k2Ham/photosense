name: End-to-end

on:
  push:
    branches: [ master, main, feature/mobile-and-mac ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# The token may read the repository and nothing more: no step writes to GitHub.
permissions:
  contents: read

jobs:
  browsers:
    # Trovolve as one program, its page in Chrome at a computer's size and in WebKit at a phone's, on photos each
    # test makes for itself (e2e/README.md). Ubuntu 24.04, as Playwright 1.56 has no browsers for the 26.04 that
    # ubuntu-latest now is.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history and its tags: a build is numbered by them (tools/version.mjs).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: |
            Trovolve.ReactUI/package.json
            e2e/package.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the tests and their browsers
        working-directory: e2e
        # The browsers' system packages are installed once, with no time limit of ours: a limit killed only the command
        # that started apt, which went on holding its lock, so every later try failed on the lock. The machine may still
        # be installing packages of its own, or briefly unable to reach Ubuntu's servers: apt waits for its locks and
        # retries a download. A browser's own download now and then stops short and never ends, so that alone is given
        # five minutes, three times, with half a minute's pause after a failed try.
        run: |
          npm ci
          echo 'DPkg::Lock::Timeout "600"; Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/90trovolve-wait
          timeout 600 bash -c 'while pgrep -x "apt|apt-get|dpkg|unattended-upgr" > /dev/null; do sleep 5; done' || true
          npx playwright install-deps chromium webkit
          for try in 1 2 3; do
            timeout 300 npx playwright install chromium webkit && exit 0
            sleep 30
          done
          exit 1

      - name: Make the program the tests drive
        working-directory: e2e
        run: npm run app

      - name: Type-check the tests
        working-directory: e2e
        run: npm run typecheck

      # Every test starts the program, so one that does not start would only time out, test after test. Started once
      # first, as Jamie starts it, a program that does not answer within a minute is shown here: what it said, and
      # where each of its threads is, read with dotnet-stack.
      - name: Start the program once
        working-directory: e2e/.cache/server
        env:
          PhotoStorage__DatabasePath: ${{ runner.temp }}/trovolve/trovolve.db
          PhotoStorage__ThumbnailPath: ${{ runner.temp }}/trovolve/thumbnails
          PhotoStorage__BackupPath: ${{ runner.temp }}/trovolve/backups
        run: |
          dotnet Trovolve.Server.dll --urls http://localhost:7199 > "$RUNNER_TEMP/said.txt" 2>&1 &
          program=$!
          for second in $(seq 60); do
            if curl -sf --max-time 2 http://localhost:7199/api/health > /dev/null; then
              echo "Trovolve answered after about $second seconds."
              kill $program; wait $program || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::Trovolve did not answer within a minute."
          echo "It said:"; cat "$RUNNER_TEMP/said.txt"
          dotnet tool install --global dotnet-stack > /dev/null && "$HOME/.dotnet/tools/dotnet-stack" report --process-id $program || true
          kill -9 $program
          exit 1

      - name: Run the tests
        working-directory: e2e
        run: npx playwright test

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
