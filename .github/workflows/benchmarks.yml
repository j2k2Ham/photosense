name: Benchmarks

on:
  workflow_dispatch:

# The token may read the repository and nothing more: no step writes to GitHub.
permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Restore
        run: dotnet restore Trovolve.sln
      - name: Run Benchmarks
        run: dotnet run -c Release --project Trovolve.Benchmarks/Trovolve.Benchmarks.csproj -- --join
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: Trovolve.Benchmarks/BenchmarkDotNet.Artifacts/results/**
