name: Benchmarks

on:
  workflow_dispatch:

# The token may read the repository and nothing more: no step writes to GitHub.
permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PhotoSense.sln
      - name: Run Benchmarks
        run: dotnet run -c Release --project PhotoSense.Benchmarks/PhotoSense.Benchmarks.csproj -- --join
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: PhotoSense.Benchmarks/BenchmarkDotNet.Artifacts/results/**
