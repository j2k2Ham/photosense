name: iPhone app

on:
  push:
    branches: [ master, main, feature/mobile-and-mac ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  BUNDLE: com.j2k2ham.photosense

jobs:
  simulator:
    # Built for the simulator, which needs no Apple account, and checked there by the app itself: the page's own
    # requests, made from inside its web view, on photos put in the simulator's library.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | head -1) at $xcode"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: 'PhotoSense.ReactUI/package.json'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the iOS workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Build the page for the app
        working-directory: PhotoSense.ReactUI
        env:
          NEXT_PUBLIC_API_BASE: /api
        run: |
          npm ci
          npm run build

      - name: Build the app for the simulator
        run: dotnet build PhotoSense.iOS/PhotoSense.iOS.csproj --configuration Release -r iossimulator-arm64 2>&1 | tee build.log

      - name: Say what the build warned of
        if: always()
        run: |
          grep -E 'warning [A-Z]+[0-9]+' build.log | sed -E 's/.*(warning [A-Z]+[0-9]+: [^[]*).*/\1/' | sort | uniq -c | sort -rn | head -10 |
            while read -r line; do echo "::warning title=Build::$line"; done
          grep -E ' error [A-Z]+[0-9]+' build.log | sed -E 's/.*( error [A-Z]+[0-9]+: [^[]*).*/\1/' | sort -u | head -10 |
            while read -r line; do echo "::error title=Build::$line"; done

      - name: Start a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime in sorted(devices, reverse=True) if '.iOS-' in runtime for d in devices[runtime] if d['name'].startswith('iPhone')))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "::notice title=Simulator::$(xcrun simctl list devices | grep "$udid")"

      - name: Put a photo, a copy of it and a JPEG of it in the simulator's library
        run: |
          mkdir -p samples
          python3 - samples/picture.bmp <<'EOF'
          import struct, sys
          w, h = 640, 480
          row = (w * 3 + 3) & ~3
          pixels = bytearray()
          for y in range(h):
              line = bytearray()
              for x in range(w):
                  line += bytes(((x * 255) // w, (y * 255) // h, ((x // 40 + y // 40) % 2) * 200))
              pixels += line + bytes(row - len(line))
          header = b'BM' + struct.pack('<IHHI', 54 + len(pixels), 0, 0, 54) + struct.pack('<IiiHHIIiiII', 40, w, h, 1, 24, 0, len(pixels), 2835, 2835, 0, 0)
          open(sys.argv[1], 'wb').write(header + pixels)
          EOF
          sips -s format heic samples/picture.bmp --out samples/IMG_0001.HEIC
          cp samples/IMG_0001.HEIC samples/IMG_0002.HEIC
          sips -s format jpeg samples/picture.bmp --out samples/IMG_0003.JPG
          xcrun simctl addmedia "$UDID" samples/IMG_0001.HEIC samples/IMG_0002.HEIC samples/IMG_0003.JPG

      - name: Install the app and let it check itself
        run: |
          app=$(find PhotoSense.iOS/bin -name '*.app' -type d | head -1)
          xcrun simctl install "$UDID" "$app"
          xcrun simctl privacy "$UDID" grant photos "$BUNDLE"
          SIMCTL_CHILD_PHOTOSENSE_SELF_CHECK=1 xcrun simctl launch "$UDID" "$BUNDLE"
          report="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)/Documents/self-check.json"
          for i in $(seq 1 300); do [ -f "$report" ] && break; sleep 1; done
          cp "$report" self-check.json 2>/dev/null || echo '{"passed": false, "steps": [{"name": "the app reported back", "ok": false, "error": "no self-check.json within five minutes"}]}' > self-check.json
          python3 - self-check.json <<'EOF'
          import json, sys
          report = json.load(open(sys.argv[1]))
          for step in report['steps']:
              said = json.dumps(step.get('value', step.get('error')))[:400]
              kind = 'notice' if step['ok'] else 'error'
              print(f"::{kind} title=Self-check::{step['name']}: {'ok' if step['ok'] else 'FAILED'} in {step.get('ms', 0)} ms: {said}")
          print(f"::notice title=Self-check::{'passed' if report['passed'] else 'failed'}, {report.get('photos', 0)} photos scanned")
          sys.exit(0 if report['passed'] else 1)
          EOF

      - name: What the app said
        if: failure()
        run: |
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "PhotoSense.iOS"' > app.log || true
          grep -iE 'exception|error|fault' app.log | tail -8 | while read -r line; do echo "::error title=App log::${line:0:500}"; done
          tail -100 app.log

      - name: Keep the report and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-simulator
          path: |
            self-check.json
            app.log
            build.log
          if-no-files-found: ignore

  testflight:
    # Signed and sent to TestFlight, to be installed on an iPhone or iPad. Skipped until the Apple account's
    # certificate, profile and App Store Connect key are in the repository's secrets (see the README).
    needs: simulator
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      READY: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_PROFILE != '' && secrets.APPSTORE_KEY_P8 != '' }}
    steps:
      - name: Wait for the Apple account
        if: env.READY != 'true'
        run: echo "::notice title=TestFlight::Skipped; the Apple account's secrets are not set up yet."

      - name: Checkout
        if: env.READY == 'true'
        uses: actions/checkout@v4

      - name: Use the newest Xcode
        if: env.READY == 'true'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Setup Node
        if: env.READY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup .NET
        if: env.READY == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the iOS workload
        if: env.READY == 'true'
        run: dotnet workload install ios

      - name: Build the page for the app
        if: env.READY == 'true'
        working-directory: PhotoSense.ReactUI
        env:
          NEXT_PUBLIC_API_BASE: /api
        run: |
          npm ci
          npm run build

      - name: Put the signing certificate and profile on this Mac
        if: env.READY == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Build the signed app
        if: env.READY == 'true'
        run: >-
          dotnet publish PhotoSense.iOS/PhotoSense.iOS.csproj --configuration Release -r ios-arm64
          -p:ArchiveOnBuild=false -p:BuildIpa=true
          -p:CodesignKey="Apple Distribution"
          -p:CodesignProvision="$PROFILE_UUID"
          -p:ApplicationVersion=${{ github.run_number }}
          -o publish/ios

      - name: Send it to TestFlight
        if: env.READY == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8
          ipa=$(find publish PhotoSense.iOS/bin -name '*.ipa' | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "::notice title=TestFlight::Build ${{ github.run_number }} sent; it shows in TestFlight once Apple has processed it."
