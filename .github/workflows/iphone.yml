name: iPhone app

on:
  push:
    branches: [ master, main, feature/mobile-and-mac ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  BUNDLE: com.j2k2ham.photosense
  # Each release of .NET for iOS needs one Xcode, and is installed by its workload set on a matching .NET SDK; the
  # three move together, as each release's notes at https://github.com/dotnet/macios/releases say. GitHub's
  # macos-26 machines have Xcode 26.x only, so the newest workload (for Xcode 27) cannot build there yet.
  XCODE: '26.6'
  DOTNET_SDK: '10.0.401'
  IOS_WORKLOAD_SET: '10.0.401'

defaults:
  run:
    # Unlike GitHub's default on a Mac, a command that fails inside a pipe (a build piped to tee) fails the step.
    shell: bash

jobs:
  simulator:
    # Built for the simulator, which needs no Apple account, and checked there by the app itself: the page's own
    # requests, made from inside its web view, on photos put in the simulator's library.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history and its tags: a build is numbered by them (tools/version.mjs).
          fetch-depth: 0

      - name: Use the Xcode the iOS workload needs
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE.app"
          echo "::notice title=Xcode::$(xcodebuild -version | head -1)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: 'PhotoSense.ReactUI/package.json'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Install the iOS workload
        run: |
          dotnet workload install ios --version "$IOS_WORKLOAD_SET"
          echo "::notice title=iOS workload::$(dotnet workload list | grep -E '^ios ' | tr -s ' ')"

      - name: Build the page for the app
        working-directory: PhotoSense.ReactUI
        env:
          NEXT_PUBLIC_API_BASE: /api
        run: |
          npm ci
          npm run build

      - name: Build the app for the simulator
        run: dotnet build PhotoSense.iOS/PhotoSense.iOS.csproj --configuration Release -r iossimulator-arm64 2>&1 | tee build.log

      - name: Say what the build warned of
        if: always()
        run: |
          # A grep that finds nothing is good news here, not a failure.
          set +o pipefail
          # MSBuild writes "file(line,col): warning CS1234: text [project]", and some errors without a code.
          pattern=': (warning|error)( [A-Za-z]+[0-9]+)? *:'
          grep -E "$pattern" build.log | grep -E ': warning' | sed -E 's/.*: (warning( [A-Za-z]+[0-9]+)? *: [^[]*).*/\1/' | sort | uniq -c | sort -rn | head -10 |
            while read -r line; do echo "::warning title=Build::$line"; done
          grep -E "$pattern" build.log | grep -E ': error' | sed -E 's/.*: (error( [A-Za-z]+[0-9]+)? *: [^[]*).*/\1/' | sort -u | head -10 |
            while read -r line; do echo "::error title=Build::$line"; done

      - name: Start a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime in sorted(devices, reverse=True) if '.iOS-' in runtime for d in devices[runtime] if d['name'].startswith('iPhone')))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "::notice title=Simulator::$(xcrun simctl list devices | grep "$udid")"

      - name: Put a photo, a copy of it and a JPEG of it in the simulator's library
        run: |
          mkdir -p samples
          python3 - samples/picture.bmp <<'EOF'
          import struct, sys
          w, h = 640, 480
          row = (w * 3 + 3) & ~3
          pixels = bytearray()
          for y in range(h):
              line = bytearray()
              for x in range(w):
                  line += bytes(((x * 255) // w, (y * 255) // h, ((x // 40 + y // 40) % 2) * 200))
              pixels += line + bytes(row - len(line))
          header = b'BM' + struct.pack('<IHHI', 54 + len(pixels), 0, 0, 54) + struct.pack('<IiiHHIIiiII', 40, w, h, 1, 24, 0, len(pixels), 2835, 2835, 0, 0)
          open(sys.argv[1], 'wb').write(header + pixels)
          EOF
          sips -s format heic samples/picture.bmp --out samples/IMG_0001.HEIC
          cp samples/IMG_0001.HEIC samples/IMG_0002.HEIC
          sips -s format jpeg samples/picture.bmp --out samples/IMG_0003.JPG
          xcrun simctl addmedia "$UDID" samples/IMG_0001.HEIC samples/IMG_0002.HEIC samples/IMG_0003.JPG

      # A run's log can be read only by someone signed in to GitHub, but its notes by anyone: each command below that
      # fails puts its own last words on the run.
      - name: Install the app
        run: |
          app=$(find PhotoSense.iOS/bin -name '*.app' -type d -print -quit)
          echo "::notice title=App::${app:-none built}"
          if ! out=$(xcrun simctl install "$UDID" "$app" 2>&1); then
            echo "::error title=simctl install::$(printf '%s' "$out" | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit 1
          fi

      - name: Let it see the photos
        run: |
          if ! out=$(xcrun simctl privacy "$UDID" grant photos "$BUNDLE" 2>&1); then
            echo "::error title=simctl privacy::$(printf '%s' "$out" | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit 1
          fi
          # What the grant left in the simulator's own record of permissions, for when the app does not see it.
          tcc="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/TCC/TCC.db"
          rows=$(sqlite3 "$tcc" "select service, client, auth_value, auth_reason, auth_version from access where client = '$BUNDLE'" 2>&1 || true)
          echo "::notice title=Permissions recorded::${rows:-none} | ${out:-simctl said nothing}"

      - name: Start it and wait for its report
        run: |
          if ! out=$(SIMCTL_CHILD_PHOTOSENSE_SELF_CHECK=1 xcrun simctl launch --stdout="$PWD/app-stdout.txt" --stderr="$PWD/app-stderr.txt" "$UDID" "$BUNDLE" 2>&1); then
            echo "::error title=simctl launch::$(printf '%s' "$out" | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit 1
          fi
          echo "::notice title=Started::$out"
          report="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)/Documents/self-check.json"
          # The app rewrites its report after every step, and marks it finished at the end.
          for i in $(seq 1 600); do
            grep -q '"finished":true' "$report" 2>/dev/null && break
            # A crash leaves a report on this Mac; there is then nothing to wait for.
            ls ~/Library/Logs/DiagnosticReports/PhotoSense* >/dev/null 2>&1 && break
            sleep 1
          done
          echo "::notice title=Waited::$i seconds"
          cp "$report" self-check.json 2>/dev/null || echo '{"passed": false, "steps": [{"name": "the app reported back", "ok": false, "error": "no self-check.json"}]}' > self-check.json

      - name: Say what it found
        run: |
          python3 - self-check.json <<'EOF'
          import json, sys
          report = json.load(open(sys.argv[1]))
          for step in report['steps']:
              said = json.dumps(step.get('value', step.get('error')))[:400]
              kind = 'notice' if step['ok'] else 'error'
              print(f"::{kind} title=Self-check::{step['name']}: {'ok' if step['ok'] else 'FAILED'} in {step.get('ms', 0)} ms: {said}")
          ended = 'passed' if report['passed'] else ('failed' if report.get('finished') else 'did not finish')
          print(f"::notice title=Self-check::{ended}, {report.get('photos', 0)} photos scanned")
          sys.exit(0 if report['passed'] else 1)
          EOF

      - name: What the app said
        if: failure()
        run: |
          set +o pipefail
          # The app's own lines: what photo access it had, the page loading, and each request with its answer.
          for file in app-stderr.txt app-stdout.txt; do
            [ -s "$file" ] && tail -40 "$file" | while read -r line; do echo "::error title=App said ($file)::${line:0:500}"; done
          done
          for crash in ~/Library/Logs/DiagnosticReports/PhotoSense*; do
            [ -f "$crash" ] || continue
            cp "$crash" .
            grep -E '"(exception|termination)"|"type"|"signal"|"reasons"|"indicator"' "$crash" | head -8 | while read -r line; do echo "::error title=Crash report::${line:0:500}"; done
          done
          # Nothing ran when the app was never built, so there is no simulator to ask.
          [ -n "$UDID" ] || exit 0
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "PhotoSense.iOS"' > app.log || true
          grep -iE 'exception|error|fault' app.log | tail -8 | while read -r line; do echo "::error title=App log::${line:0:500}"; done
          tail -100 app.log

      - name: Keep the report and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-simulator
          path: |
            self-check.json
            app.log
            app-std*.txt
            PhotoSense*.ips
            build.log
          if-no-files-found: ignore

  testflight:
    # Signed and sent to TestFlight, to be installed on an iPhone or iPad. Skipped until the Apple account's
    # certificate, profile and App Store Connect key are in the repository's secrets (see the README).
    needs: simulator
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      READY: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_PROFILE != '' && secrets.APPSTORE_KEY_P8 != '' }}
    steps:
      - name: Wait for the Apple account
        if: env.READY != 'true'
        run: echo "::notice title=TestFlight::Skipped; the Apple account's secrets are not set up yet."

      - name: Checkout
        if: env.READY == 'true'
        uses: actions/checkout@v4
        with:
          # The whole history and its tags: a build is numbered by them (tools/version.mjs).
          fetch-depth: 0

      - name: Use the Xcode the iOS workload needs
        if: env.READY == 'true'
        run: sudo xcode-select -s "/Applications/Xcode_$XCODE.app"

      - name: Setup Node
        if: env.READY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup .NET
        if: env.READY == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Install the iOS workload
        if: env.READY == 'true'
        run: dotnet workload install ios --version "$IOS_WORKLOAD_SET"

      - name: Build the page for the app
        if: env.READY == 'true'
        working-directory: PhotoSense.ReactUI
        env:
          NEXT_PUBLIC_API_BASE: /api
        run: |
          npm ci
          npm run build

      - name: Put the signing certificate and profile on this Mac
        if: env.READY == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Build the signed app
        if: env.READY == 'true'
        run: >-
          dotnet publish PhotoSense.iOS/PhotoSense.iOS.csproj --configuration Release -r ios-arm64
          -p:ArchiveOnBuild=false -p:BuildIpa=true
          -p:CodesignKey="Apple Distribution"
          -p:CodesignProvision="$PROFILE_UUID"
          -o publish/ios

      - name: Send it to TestFlight
        if: env.READY == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8
          ipa=$(find publish PhotoSense.iOS/bin -name '*.ipa' | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "::notice title=TestFlight::Version $(node tools/version.mjs --part iphone) sent; it shows in TestFlight once Apple has processed it."
