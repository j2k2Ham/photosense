name: PhotoSense CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: 'PhotoSense.ReactUI/package.json'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PhotoSense.sln

      - name: Build
        run: dotnet build PhotoSense.sln --configuration Release --no-restore /warnaserror

      - name: Install React UI deps
        working-directory: PhotoSense.ReactUI
        run: npm ci

      - name: Test React UI (fails below 100% coverage)
        working-directory: PhotoSense.ReactUI
        run: npm run test:coverage

      - name: Build React UI
        working-directory: PhotoSense.ReactUI
        run: npm run build

      - name: Test with coverage
        # TUnit tests are a program: run it, and hand it its own options after the two dashes.
        run: >-
          dotnet run --project PhotoSense.Tests/PhotoSense.Tests.csproj
          --configuration Release --no-build
          --
          --coverlet
          --coverlet-output-format opencover
          --coverlet-include "[PhotoSense.*]*"
          --coverlet-exclude "[PhotoSense.Tests]*"
          --coverlet-exclude-by-file "**/*.g.cs"
          --results-directory ${{ github.workspace }}/PhotoSense.Tests/coverage
          --report-trx --report-trx-filename test-results.trx

      - name: ReportGenerator (HTML)
        # Use literal block to run two commands sequentially without stray backslashes.
        run: |
          dotnet tool restore
          echo "Listing coverage files" && ls -R . | grep coverage || true
          dotnet tool run reportgenerator "-reports:PhotoSense.Tests/coverage/coverage.opencover*.xml" -targetdir:coverage/report "-reporttypes:HtmlSummary;lcov;XmlSummary" -historydir:coverage/history || echo "Report generation failed (will succeed once coverage file exists)"
        if: always()

      - name: Enforce coverage thresholds (Line >= 90% / Branch >= 85%)
        if: success()
        run: |
          set -e
          thresholdLine=0.90
          thresholdBranch=0.85
          # The report's name carries the time it was written.
          coverageXml=$(ls PhotoSense.Tests/coverage/coverage.opencover*.xml 2>/dev/null | head -1)
          if [ -z "$coverageXml" ]; then
            echo "Coverage file not found"; ls -R PhotoSense.Tests/coverage || true; exit 1
          fi
          # Extract sequence (line) and branch coverage from OpenCover XML summary attributes
          linePct=$(grep -oP 'sequenceCoverage="\K[0-9.]+' "$coverageXml" | head -1)
          branchPct=$(grep -oP 'branchCoverage="\K[0-9.]+' "$coverageXml" | head -1)
          if [ -z "$linePct" ] || [ -z "$branchPct" ]; then
            echo "Could not extract coverage metrics. Dumping first 40 lines:";
            head -40 "$coverageXml"; exit 1;
          fi
          echo "Line coverage: $linePct% (threshold: $(awk -v t=$thresholdLine 'BEGIN{print t*100}'))"
          echo "Branch coverage: $branchPct% (threshold: $(awk -v t=$thresholdBranch 'BEGIN{print t*100}'))"
          awk -v p=$linePct -v t=$thresholdLine 'BEGIN{ exit (p/100 < t) }' || { echo "Line coverage below threshold"; exit 1; }
          awk -v p=$branchPct -v t=$thresholdBranch 'BEGIN{ exit (p/100 < t) }' || { echo "Branch coverage below threshold"; exit 1; }

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/test-results.trx
            coverage/**

  service-on-windows-and-mac:
    # The service on the systems people run it on, built into one program and started; the job above measures coverage on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: 'PhotoSense.ReactUI/package.json'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build PhotoSense.sln --configuration Release -warnaserror

      - name: Test
        run: dotnet run --project PhotoSense.Tests/PhotoSense.Tests.csproj --configuration Release --no-build

      - name: Publish as one program
        shell: pwsh
        run: ./publish.ps1 -Output publish/ci

      - name: Start it, and ask it for the page and the service
        shell: pwsh
        run: |
          $program = if ($IsWindows) { 'publish/ci/PhotoSense.Server.exe' } else { 'publish/ci/PhotoSense.Server' }
          $env:PhotoStorage__DatabasePath = Join-Path $env:RUNNER_TEMP 'photosense/photosense.db'
          $env:PhotoStorage__ThumbnailPath = Join-Path $env:RUNNER_TEMP 'photosense/thumbnails'
          $started = Start-Process $program -PassThru -NoNewWindow
          try {
            $health = $null
            for ($i = 0; $i -lt 60 -and -not $health; $i++) {
              try { $health = Invoke-RestMethod http://localhost:7071/api/health } catch { Start-Sleep -Seconds 1 }
            }
            if ($health.status -ne 'ok') { throw 'The service did not answer.' }
            $page = Invoke-WebRequest http://localhost:7071/ -UseBasicParsing
            if ($page.Content -notmatch '<title>PhotoSense</title>') { throw 'The page was not served.' }
            Write-Host "PhotoSense ran on $env:RUNNER_OS ($env:RUNNER_ARCH)."
          } finally {
            Stop-Process -Id $started.Id -Force
          }
