# Weekly updates of every package (Jamie, 2026-11-11). Updates for known vulnerabilities come as well, whenever
# one is published, from the repository's own settings.
#
# Dependabot reads this file from main only. Its pull requests go to main (Jamie, 2026-11-12), where every check runs
# before one can be merged; pull requests into another branch run none, which let three rounds of updates in unchecked.
#
# Smaller updates come together, one pull request per ecosystem and folder; each major version comes alone, as it
# may need changes to the code.
version: 2

updates:
  - package-ecosystem: nuget
    # The solution, and the phone apps, which are not in it.
    directories: [ "/", "/PhotoSense.iOS", "/PhotoSense.Android" ]
    schedule:
      interval: weekly
    groups:
      nuget:
        update-types: [ minor, patch ]

  - package-ecosystem: npm
    directories: [ "/PhotoSense.ReactUI", "/e2e" ]
    schedule:
      interval: weekly
    ignore:
      # The page's lint (typescript-eslint, through eslint-config-next) refuses TypeScript 7.0; see
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940. Take this out once it supports 7.
      - dependency-name: typescript
        update-types: [ "version-update:semver-major" ]
      # The page's lint holds it to every accessibility rule of eslint-plugin-jsx-a11y, which supports ESLint up to 9
      # only. Take this out once it supports 10.
      - dependency-name: eslint
        update-types: [ "version-update:semver-major" ]
    groups:
      # Vitest's own packages each require the same version of Vitest, so a new major of one comes with the rest.
      vitest:
        patterns: [ "vitest", "@vitest/*" ]
      npm:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [ minor, patch ]
